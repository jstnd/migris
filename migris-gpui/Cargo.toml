[package]
name = "migris-gpui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
winresource = "0.1.31"

[dependencies]
migris = { workspace = true }

anyhow = "1.0.102"
directories = "6.0.0"
futures-util = { workspace = true }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", features = ["tree-sitter-sql"] }
indexmap = "2.14.0"
keyring-core = "1.0.0"
rust-embed = "8.11.0"
serde = { workspace = true }
serde_json = "1.0.149"
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.23.1", features = ["serde", "v7"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[lints]
workspace = true
